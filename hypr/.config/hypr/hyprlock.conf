# Lock screen. Keys follow /usr/share/hypr/hyprlock.conf (hyprlock 0.9.x).
source = ~/.config/hypr/colors.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/dotfiles/wallpapers/mountains-dusk.jpg
    color = $bg
    blur_passes = 3
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 10
    inner_color = $raised
    outer_color = $accent
    check_color = $green
    fail_color = $red
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
