[dmenu]
dmenu_command = rofi -dmenu -i
active_chars = ==
highlight = True
highlight_bold = True
compact = True
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s} {icon:>4}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = True

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
